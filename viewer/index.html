<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Viewer</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --border:#d1d5db; --grid:#eef0f3; --axis:#9ca3af; --accent:#0f766e;
          --a:#2563eb; --b:#dc2626; --c:#d4a017; --fault:rgba(253,230,138,.45); }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--ink); background:#fff; }
  header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  select, button { font:inherit; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); }
  main { display:grid; grid-template-columns: 340px 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  textarea { width:100%; height:260px; font:12px/1.4 ui-monospace, monospace; border:1px solid var(--border); border-radius:6px; padding:8px; }
  .side h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
  .note { color:var(--muted); font-size:13px; }
  table { border-collapse:collapse; width:100%; font:12px ui-monospace, monospace; }
  td { padding:3px 4px; border-bottom:1px solid var(--grid); }
  td:last-child { text-align:right; }
  .ok { color:#166534; } .bad { color:#991b1b; }
  .plot { border:1px solid var(--border); border-radius:8px; padding:6px 8px 4px; margin-bottom:10px; }
  .plot .ttl { font-size:12px; font-weight:600; display:flex; gap:12px; flex-wrap:wrap; }
  .plot .ttl span { font-weight:400; color:var(--muted); }
  .sw { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:4px; }
  canvas { width:100%; height:170px; display:block; }
  #modes { height:34px; }
  #hover { font:12px ui-monospace, monospace; color:var(--muted); min-height:18px; margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <h1>Engine viewer</h1>
  <select id="preset"></select>
  <button id="run">Run</button>
  <button id="play" class="ghost">❚❚ Pause</button>
  <button id="all" class="ghost">Show all</button>
  <label class="note">sweep
    <select id="sweep">
      <option value="2">2 s</option>
      <option value="5" selected>5 s</option>
      <option value="10">10 s</option>
      <option value="20">20 s</option>
    </select>
  </label>
  <span id="status" class="note"></span>
</header>
<main>
  <section class="side">
    <div class="note" id="desc"></div>
    <h3>Config (editable JSON)</h3>
    <textarea id="cfg" spellcheck="false"></textarea>
    <h3>Key numbers</h3>
    <table id="nums"></table>
    <p class="note">Peak per-unit. Q &gt; 0 = injecting. φ = arg(I) − arg(V). Yellow band = fault active. Run sweeps the traces left to right; Space = play/pause, click a plot to jump the cursor there.</p>
  </section>
  <section>
    <div id="hover"></div>
    <div id="plots"></div>
  </section>
</main>
<script type="module" src="./viewer.js"></script>
</body>
</html>
